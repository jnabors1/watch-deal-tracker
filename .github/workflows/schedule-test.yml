name: Schedule Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm scheduled execution
        run: |
          echo "Schedule test ran"
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"
