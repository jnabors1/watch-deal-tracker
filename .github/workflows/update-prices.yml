name: Update Watch Prices

on:
  schedule:
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-watch-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check WatchPatrol
        run: |
          python watchpatrol_tracker.py

      - name: Update dashboard timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("data.json", "r") as f:
              data = json.load(f)

          data["updated"] = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          with open("data.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Save updated data
        run: |
          git config user.name "Watch Deal Tracker"
          git config user.email "actions@github.com"

          git add data.json watchpatrol.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update watch price data"

          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Unable to push after 5 attempts."
          exit 1
