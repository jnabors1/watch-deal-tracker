name: Update Watch Prices

on:
  schedule:
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check WatchPatrol
        run: |
          python watchpatrol_tracker.py

      - name: Update dashboard timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("data.json", "r") as f:
              data = json.load(f)

          data["updated"] = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          with open("data.json", "w") as f:
              json.dump(data, f, indent=2)

          PY

      - name: Commit updated data
        run: |
          git config user.name "Watch Deal Tracker"
          git config user.email "actions@github.com"

          git add data.json watchpatrol.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update watch price data"
            git push
          fi
