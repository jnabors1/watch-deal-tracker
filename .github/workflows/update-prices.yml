name: Update Watch Prices

on:
  schedule:
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-watch-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check WatchPatrol
        run: |
          python watchpatrol_tracker.py

      - name: Check eBay
        run: |
          python ebay_tracker.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        continue-on-error: true

      - name: Check WatchMaxx
        run: |
          python watchmaxx_tracker.py
        continue-on-error: true

      - name: Merge data sources
        run: |
          python merge_data.py

      - name: Save updated data
        run: |
          git config user.name "Watch Deal Tracker"
          git config user.email "actions@github.com"

          git add data.json watchpatrol.json || true
          git add ebay_data.json 2>/dev/null || true
          git add watchmaxx_data.json 2>/dev/null || true
          git add history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update watch price data"

          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Unable to push after 5 attempts."
          exit 1
